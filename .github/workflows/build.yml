name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Type-check frontend
        run: npm run typecheck

      - name: Compile TypeScript backend
        run: npm run build:server

      - name: Test Telegram authentication
        run: npm test

      - name: Build frontend
        run: npm run build:frontend

      - name: Build production Docker image
        run: docker build -t ton-arena:ci .

      - name: Smoke-test production container
        run: |
          docker run -d --name ton-arena-ci -p 3001:3001 ton-arena:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health
          curl -fsS http://127.0.0.1:3001/ | grep -q 'id="root"'
          docker rm -f ton-arena-ci
